# SonarCloud automatic analysis settings.
#
# docs/design holds static HTML design mockups and the scripts that generate
# them. They are reference material, not shipped code, so their markup, CSS and
# script findings are noise. The Postgres migrations under migrations/ are
# read by the PL/SQL analyzer, which does not understand Postgres SQL and
# reports false findings. Automatic analysis cannot change the analyzer's file
# suffixes, so exclude the .sql files from analysis instead.
sonar.exclusions=docs/design/**,**/*.sql
#
# src/shared/api-types.ts is generated by `npm run codegen:api` (RT-869): one
# namespace per vendored Backend-Core contract file, and those contracts each
# declare their own copy of the shared error / response components. That
# repetition is the contracts', not hand-written code, so it is excluded from
# copy-paste detection only (it is still analysed for everything else).
sonar.cpd.exclusions=src/shared/api-types.ts
