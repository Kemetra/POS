# Phase 10 / US8 — CI pipeline + package dry-run artifact.
#
# Single job on windows-latest exercising the full validation gate stack
# on every PR plus pushes to main. Constitution v1.2.x principles upheld:
#   - VI Test-First: full vitest suite + coverage thresholds enforced
#     per-file (80% global, 95% Money) — failure blocks merge.
#   - VII Observability: package:dir uploads the unsigned --dir build
#     for manual smoke. Sentry stays inert (no SENTRY_DSN secret wired).
#   - Tech Stack (research.md §7): windows-latest runner, Node 20, npm
#     cache, electron-rebuild via package.json postinstall.
#
# Pre-flight decisions for this workflow are documented in the Phase 10
# PR body (D1–D7). Two are load-bearing inside this file:
#   D1 — `npm run build` runs as its own step BEFORE `npm run package:dir`.
#        electron-builder.yml's `files: [dist/**, ...]` requires `dist/`
#        to be populated by `vite build` + `tsc -p tsconfig.{main,preload}`
#        first, and the `package:dir` script does NOT chain `build`.
#   D2 — Native rebuild for `better-sqlite3` is handled implicitly by
#        `package.json`'s `postinstall` hook (electron-rebuild). We do
#        NOT add an explicit `npx @electron/rebuild` step.
#
# Docs-only fast path (D3):
#   On pull_request events, if every changed file matches the docs/design
#   pattern (*.md, docs/**, specs/**, .impeccable/**), the heavy
#   codegen/typecheck/test/build/package gates are skipped. A lightweight
#   Prettier check runs on changed .md/.json files instead. The required
#   `ci` job still completes successfully. Pushes to main always run the
#   full gate stack. Non-docs PRs keep the existing full CI behaviour.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detect whether this PR touches only documentation/design files.
      # Outputs docs_only=true when every changed file matches the pattern:
      #   *.md | docs/** | specs/** | .impeccable/**
      # Step is skipped on push-to-main; docs_only remains unset (falsy) so
      # all downstream conditions fall through to the full-CI path.
      - name: Detect docs-only PR
        id: docs-check
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $changedFiles = git diff --name-only "origin/${{ github.base_ref }}" HEAD
          Write-Host "Changed files:"
          $changedFiles | ForEach-Object { Write-Host "  $_" }
          $docsPattern = '\.(md)$|^(docs|specs|\.impeccable)/'
          $nonDocsFiles = @($changedFiles | Where-Object { $_ -notmatch $docsPattern })
          $docsOnly = if ($nonDocsFiles.Count -eq 0) { "true" } else { "false" }
          Write-Host "docs_only=$docsOnly"
          "docs_only=$docsOnly" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Docs-only path: install packages without lifecycle scripts to get
      # Prettier available without triggering the electron-rebuild postinstall.
      - name: Install dependencies (docs-only, skip postinstall)
        if: steps.docs-check.outputs.docs_only == 'true'
        run: npm ci --ignore-scripts

      # Full path: postinstall runs electron-rebuild -f -w better-sqlite3 (D2).
      - name: Install dependencies
        if: steps.docs-check.outputs.docs_only != 'true'
        run: npm ci

      - name: Verify OpenAPI codegen drift
        if: steps.docs-check.outputs.docs_only != 'true'
        run: npm run codegen:verify

      - name: Typecheck
        if: steps.docs-check.outputs.docs_only != 'true'
        run: npm run typecheck

      # Docs-only: lightweight Prettier format-check on changed .md/.json files.
      - name: Prettier check (docs-only)
        if: steps.docs-check.outputs.docs_only == 'true'
        shell: pwsh
        run: |
          $changedFiles = git diff --name-only "origin/${{ github.base_ref }}" HEAD
          $filesToCheck = @($changedFiles | Where-Object { $_ -match '\.(md|json)$' })
          if ($filesToCheck.Count -gt 0) {
            Write-Host "Prettier-checking:"
            $filesToCheck | ForEach-Object { Write-Host "  $_" }
            npx prettier --check $filesToCheck
          } else {
            Write-Host "No .md/.json files to Prettier-check."
          }

      - name: Lint
        if: steps.docs-check.outputs.docs_only != 'true'
        run: npm run lint

      # postinstall (electron-rebuild -f -w better-sqlite3) rebuilds argon2
      # for Electron's ABI as a side-effect, making it incompatible with the
      # plain Node 20 process that Vitest forks use. Rebuild argon2 here for
      # Node 20 so the test suite can load it without a segfault.
      - name: Rebuild argon2 for Node 20 ABI (test suite)
        if: steps.docs-check.outputs.docs_only != 'true'
        run: npm rebuild argon2

      - name: Test with coverage
        if: steps.docs-check.outputs.docs_only != 'true'
        run: npm test -- --coverage

      # Restore argon2 to Electron ABI before packaging so the installed app
      # loads the correct native binary at runtime.
      - name: Rebuild argon2 for Electron ABI (packaging)
        if: steps.docs-check.outputs.docs_only != 'true'
        run: npx electron-rebuild -f -w argon2

      # `npm run package:dir` packs whatever sits under `dist/` per
      # electron-builder.yml's `files` glob; the `package:dir` script
      # does NOT chain `build`. CI must populate `dist/` first (D1).
      - name: Build (renderer + main + preload)
        if: steps.docs-check.outputs.docs_only != 'true'
        run: npm run build

      - name: Package (Windows --dir, unsigned)
        if: steps.docs-check.outputs.docs_only != 'true'
        run: npm run package:dir

      # The unpacked build is a manual-smoke convenience artifact, not a gate.
      # A transient artifact-storage quota wall (recalculated every 6-12h) must
      # NOT fail the required `ci` job — the code gates above already passed.
      # continue-on-error keeps the upload best-effort: a quota/transient
      # failure is surfaced on the step but does not block merge.
      - name: Upload unpacked Windows build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pos-pulse-win-unpacked-${{ github.sha }}
          path: dist-electron/win-unpacked
          retention-days: 1
