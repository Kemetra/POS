# Phase 10 / US8 — CI pipeline + package dry-run artifact.
# RT-217 PR A — split into parallel jobs for wall-clock speed.
#
# Job graph (every job below `changes` starts in parallel):
#
#   changes ──┬── static   (ubuntu)  contract conformance, codegen drift,
#             │                      renderer build, typecheck, lint
#             ├── test-shard (ubuntu x3)  vitest --shard=i/3 (minus the contract
#             │     │                     subset `static` already ran); coverage
#             │     │                     collected per shard, NOT gated
#             │     └── test (ubuntu)     merges the shard blobs; coverage
#             │                           thresholds evaluated ONCE here (RT-588)
#             ├── package  (windows) build + package:dir (+ main-only upload);
#             │                      PRs: only when `needs_package` (RT-585)
#             └── docs     (ubuntu)  docs-only PRs: Prettier on changed .md/.json
#   ci  ← aggregate of all of the above. `ci` is the ONLY required status
#         check on `main` (ruleset `protect-main`), so its name must not change.
#
# Constitution v1.2.x principles upheld:
#   - VI Test-First: full vitest suite + coverage thresholds enforced
#     per-file (80% global, 95% Money) — failure blocks merge via `ci`.
#   - VII Observability: package:dir uploads the unsigned --dir build
#     for manual smoke. Sentry stays inert (no SENTRY_DSN secret wired).
#   - Tech Stack (research.md §7): Node 24 (matches Electron 44's bundled
#     Node; RT-109), npm cache, electron-rebuild via package.json postinstall.
#
# Why the ubuntu jobs install with `--ignore-scripts` (RT-217):
#   The only install scripts are electron's binary download and the
#   `postinstall` electron-rebuild of better-sqlite3 — both exist for the
#   packaged Electron app only. Nothing in static/test loads them: the test
#   suite uses sql.js, and argon2 (N-API) loads its bundled linux-x64 prebuild
#   via node-gyp-build. This is exactly the state the old single Windows job
#   reached with its "Rebuild argon2 for Node 24 ABI" step. The full suite was
#   verified on Linux before the move (577/577 files, same 3 skipped as on
#   windows-latest).
#
# Windows stays ONLY for the native, platform-bound work: `npm ci` with the
# electron-rebuild postinstall, the argon2 Electron-ABI rebuild, and
# `package:dir` (electron-builder --win). It builds `dist/` itself: building
# on ubuntu and handing `dist/` over as an artifact would serialise the two
# jobs and lengthen the critical path.
#
# Load-bearing pre-flight decisions (Phase 10 PR body D1–D3):
#   D1 — `npm run build` runs as its own step BEFORE `npm run package:dir`.
#        electron-builder.yml's `files: [dist/**, ...]` requires `dist/`
#        to be populated first, and `package:dir` does NOT chain `build`.
#   D2 — Native rebuild for `better-sqlite3` is handled implicitly by
#        `package.json`'s `postinstall` hook (electron-rebuild) in the
#        `package` job. We do NOT add an explicit `npx @electron/rebuild`.
#   D3 — Docs-only fast path: on pull_request events, if every changed file
#        matches *.md | docs/** | specs/** | .impeccable/**, the heavy jobs are
#        skipped and the `docs` job Prettier-checks changed .md/.json files
#        instead. The required `ci` job still completes successfully. Pushes
#        to main always run the full stack.
#   D4 — RT-585 risk-tiered Windows package: on pull_request events the
#        Windows `package` job runs UNLESS every changed path is on the
#        package-irrelevant allowlist (src/renderer/**, tests/**, docs).
#        It is an ALLOWLIST OF SKIPS, not a list of triggers: any path that
#        matches no rule (src/main, src/preload, src/shared, migrations/,
#        package.json, the lockfile, electron-builder.yml, vite/tsconfig,
#        build/scripts, .github/**, ...) needs the Windows job. Pushes to main
#        always package. The `ci` aggregate FAILS if `package` was needed but
#        did not succeed (skipped, failed or cancelled).
#        RT-775 exception: `tests/e2e/` is carved out of the `tests/**` skip, so
#        a PR touching it still runs the Windows job (it is the only job that
#        runs that suite). The rest of `tests/**` and `src/renderer/**` still skip.
#        Observation period: the RT-773 Playwright Electron smoke runs in
#        `package` between `npm run build` and `package:dir` with
#        `continue-on-error: true`, so it can never fail `package` or `ci`.
#        A preceding non-blocking step raises the runner display (1024x768 by
#        default) so the renderer's 1024px width floor does not hide the screen.
#        Log output only (no artifact/trace upload). Making it blocking is a
#        separate change after the observation period (RT-775 exit criterion).

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # RT-588 — number of vitest shards; must equal the `test-shard` matrix size
  # (checked at run time in both the shard and the merge job).
  TEST_SHARD_COUNT: 3

# A new push to a PR cancels that PR's in-flight run. Pushes to main get a
# per-commit group, so every merged commit is still fully validated (and
# its unpacked build uploaded) instead of being cancelled by the next merge.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs-check.outputs.docs_only }}
      needs_package: ${{ steps.package-check.outputs.needs_package }}
    steps:
      # pull_request checks out the synthetic merge commit; depth 2 makes its
      # first parent (the base-branch tip) available, so HEAD^1..HEAD is
      # exactly the PR's change set (same set as the old
      # `git diff origin/<base> HEAD`) without fetching full history.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect docs-only PR
        id: docs-check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event: full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "Changed files:"
          printf '  %s\n' $changed
          non_docs="$(printf '%s\n' "$changed" | grep -Ev '\.md$|^(docs|specs|\.impeccable)/' | grep -v '^$' || true)"
          if [ -z "$changed" ] || [ -n "$non_docs" ]; then docs_only=false; else docs_only=true; fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      # RT-585 — does this change need the Windows packaging job? Fail-safe
      # direction: only a change made EXCLUSIVELY of package-irrelevant paths
      # (renderer sources, tests, docs/specs, root-level markdown, agent/spec
      # tooling dirs; .github/** is never on the list, even for markdown)
      # skips it. Everything else, including paths no rule names, needs it.
      # --no-renames: a move out of src/main into src/renderer must list the
      # deleted src/main path too, not only the new renderer one.
      - name: Detect whether the Windows package job is needed
        id: package-check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event: package needed."
            echo "needs_package=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          skip_re='^(src/renderer|tests|docs|specs|\.impeccable|\.specify|\.claude)/|^[^/]*\.md$'
          changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          needs="$(printf '%s\n' "$changed" | grep -v '^$' | grep -Ev "$skip_re" || true)"
          # RT-775 — tests/e2e/ is on the skip allowlist via `tests/`, but the
          # Playwright Electron smoke only runs in this Windows job. ERE has no
          # lookahead, so add it back with a second match rather than editing skip_re.
          e2e="$(printf '%s\n' "$changed" | grep -E '^tests/e2e/' || true)"
          if [ -n "$e2e" ]; then needs="$(printf '%s\n%s\n' "$needs" "$e2e" | grep -v '^$')"; fi
          if [ -z "$changed" ] || [ -n "$needs" ]; then needs_package=true; else needs_package=false; fi
          echo "Paths that require the package job:"
          printf '  %s\n' "${needs:-<none>}"
          echo "needs_package=$needs_package"
          echo "needs_package=$needs_package" >> "$GITHUB_OUTPUT"

  static:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      # RT-217 PR B lands the Backend-Core contract-conformance suite under
      # tests/contract/backend-core/. It runs first so a cross-repo contract
      # break fails within the first minute. RT-585: this is the ONE blocking
      # run of the subset: the `test` job excludes it (verified: every
      # per-file coverage threshold still passes without it; it is ~3 s).
      # Kept here rather than in `test` because it fails fast and keeps the
      # longest job (`test`) shorter.
      # `npm test` is `vitest run --passWithNoTests` from the locked devDependency,
      # so nothing is fetched on demand (RT-506, Sonar S6505/S8543).
      - name: Backend-Core contract conformance
        run: npm test -- tests/contract/backend-core

      - name: Verify OpenAPI codegen drift
        run: npm run codegen:verify

      # RT-585 — compensating control for the package-skip path: a
      # renderer-only PR does not reach the Windows job, so the Vite renderer
      # build (the one packaged-output step that can break without a type or
      # test failure) is still proven here on ubuntu.
      - name: Build renderer (vite)
        run: npm run build:renderer

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # RT-588 — the vitest suite is split across TEST_SHARD_COUNT parallel
  # runners (`vitest --shard=i/N`, a deterministic partition by test file, so
  # every file runs on exactly one shard). Shards only COLLECT coverage into a
  # blob report (vitest.shard.config.ts drops the thresholds); the thresholds
  # are evaluated once, on the merged coverage, by the `test` job below.
  test-shard:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      # Guard: the matrix and TEST_SHARD_COUNT must agree, or the merge job's
      # blob-count check would be comparing against the wrong number.
      - name: Check matrix size matches TEST_SHARD_COUNT
        shell: bash
        run: |
          if [ "${{ strategy.job-total }}" != "$TEST_SHARD_COUNT" ]; then
            echo "::error::matrix has ${{ strategy.job-total }} shards but TEST_SHARD_COUNT=$TEST_SHARD_COUNT"; exit 1
          fi

      # RT-585: tests/contract/backend-core already ran (blocking) in `static`.
      - name: Test shard ${{ matrix.shard }}/${{ strategy.job-total }} (coverage collected, not gated)
        run: >-
          npm test -- --coverage
          --config vitest.shard.config.ts
          --exclude 'tests/contract/backend-core/**'
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default --reporter=blob

      - name: Upload vitest blob report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          # upload-artifact@v4 skips dot-directories unless told otherwise;
          # without this the blob dir uploads as "no files found".
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Required-by-`ci` merge job. Keeps the job name `test`. It is skipped (so
  # `ci` fails) unless EVERY shard succeeded — the default `success()` guard.
  test:
    needs: [changes, test-shard]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Download shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest-reports

      # A missing blob would silently drop a slice of the suite from the
      # merged report; fail loudly instead.
      - name: Check every shard blob is present
        shell: bash
        run: |
          count="$(find .vitest-reports -maxdepth 1 -name 'blob-*.json' | wc -l)"
          echo "blob reports: $count (expected $TEST_SHARD_COUNT)"
          ls -la .vitest-reports
          if [ "$count" != "$TEST_SHARD_COUNT" ]; then
            echo "::error::expected $TEST_SHARD_COUNT shard blob reports, found $count"; exit 1
          fi

      # The ONLY place coverage thresholds are evaluated: the unmodified
      # vitest.config.ts (per-file 80%, money.ts 95%, per-glob overrides)
      # applied to coverage merged across all shards. Also writes the merged
      # coverage/lcov.info used below and prints the whole-suite test totals.
      - name: Merge shard reports + coverage thresholds
        run: npm test -- --merge-reports --coverage

      # RT-462 — non-blocking Codecov upload of the lcov report the step above
      # already produced (no second test run). Informational only: this step
      # can never fail the job, so the `ci` aggregate and the per-file coverage
      # thresholds remain the sole gates. Skipped for fork PRs, which cannot
      # read CODECOV_TOKEN. Unit-test coverage is not packaged/hardware/E2E
      # evidence.
      - name: Check coverage report exists
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::warning::coverage/lcov.info not found; Codecov upload will have nothing to send."
          fi

      - name: Upload coverage to Codecov
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        timeout-minutes: 3
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  package:
    needs: changes
    # `!= 'false'` fails safe: an empty/missing output still packages.
    # Independent of docs_only: a markdown-only PR outside the skip allowlist
    # (e.g. .github/README.md, src/main/README.md) is docs_only but still
    # needs_package, and must still be packaged.
    if: needs.changes.outputs.needs_package != 'false'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Full install: postinstall runs electron-rebuild -f -w better-sqlite3 (D2).
      - name: Install dependencies
        run: npm ci

      # Electron-ABI argon2 for the packaged app — the same final state the
      # old single job reached before packaging.
      - name: Rebuild argon2 for Electron ABI (packaging)
        run: npx electron-rebuild -f -w argon2

      - name: Build (renderer + main + preload)
        run: npm run build

      # RT-775 — the windows-latest display is 1024x768 (work area 1024x720), so
      # Electron clamps the 1280x800 window to a 1008x681 page and the renderer's
      # 1024px width floor shows only the "screen too small" guard. Raise the
      # display with the Win32 API (no third-party action or module) before the
      # smoke. Non-blocking, like the smoke itself; logs the modes it saw.
      - name: Raise runner display resolution (RT-775, non-blocking)
        continue-on-error: true
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class Disp {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;
              public int dmFields; public int dmPositionX; public int dmPositionY;
              public int dmDisplayOrientation; public int dmDisplayFixedOutput;
              public short dmColor; public short dmDuplex; public short dmYResolution; public short dmTTOption; public short dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight;
              public int dmDisplayFlags; public int dmDisplayFrequency; public int dmICMMethod; public int dmICMIntent;
              public int dmMediaType; public int dmDitherType; public int dmReserved1; public int dmReserved2;
              public int dmPanningWidth; public int dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] public static extern bool EnumDisplaySettings(string dev, int mode, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
            public static DEVMODE Blank() { var d = new DEVMODE(); d.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE)); return d; }
          }
          "@
          $cur = [Disp]::Blank()
          [void][Disp]::EnumDisplaySettings([NullString]::Value, -1, [ref]$cur)
          "current: $($cur.dmPelsWidth)x$($cur.dmPelsHeight) @ $($cur.dmBitsPerPel)bpp"
          $modes = @{}
          for ($i = 0; ; $i++) {
            $m = [Disp]::Blank()
            if (-not [Disp]::EnumDisplaySettings([NullString]::Value, $i, [ref]$m)) { break }
            $modes["$($m.dmPelsWidth)x$($m.dmPelsHeight)"] = $m
          }
          "supported: " + (($modes.Keys | Sort-Object) -join ' ')
          foreach ($want in '1920x1080', '1600x1200', '1600x900', '1280x1024') {
            if (-not $modes.ContainsKey($want)) { continue }
            $m = $modes[$want]
            $m.dmFields = 0x180000
            $rc = [Disp]::ChangeDisplaySettings([ref]$m, 0)
            "try ${want}: ChangeDisplaySettings=$rc"
            if ($rc -eq 0) { break }
          }
          $now = [Disp]::Blank()
          [void][Disp]::EnumDisplaySettings([NullString]::Value, -1, [ref]$now)
          "now: $($now.dmPelsWidth)x$($now.dmPelsHeight)"
          if ($now.dmPelsWidth -lt 1280 -or $now.dmPelsHeight -lt 800) { throw "display still below 1280x800" }

      # RT-775 (RT-773 smoke, RT-774 D-1..D-4) — observation period: launches the
      # real built app via Playwright's Electron driver (no `playwright install`:
      # no bundled browser is used). Non-blocking; log output only.
      - name: Playwright Electron smoke (RT-773, non-blocking)
        continue-on-error: true
        run: npx playwright test -c tests/e2e/playwright.config.ts

      - name: Package (Windows --dir, unsigned)
        run: npm run package:dir

      # The unpacked build is a manual-smoke convenience artifact, not a gate.
      # A transient artifact-storage quota wall (recalculated every 6-12h) must
      # NOT fail the required `ci` job — the code gates already passed.
      # continue-on-error keeps the upload best-effort.
      - name: Upload unpacked Windows build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pos-pulse-win-unpacked-${{ github.sha }}
          path: dist-electron/win-unpacked
          retention-days: 1

  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (docs-only, skip postinstall)
        run: npm ci --ignore-scripts

      - name: Prettier check (docs-only)
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only HEAD^1 HEAD | grep -E '\.(md|json)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            echo "Prettier-checking:"
            printf '  %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          else
            echo "No .md/.json files to Prettier-check."
          fi

  # Aggregate gate. Keeps the required check name `ci`. `if: always()` makes
  # it run (and FAIL) when a needed job failed or was cancelled — without it
  # a failed dependency would leave `ci` "skipped", which GitHub counts as
  # passing. Which jobs must succeed depends on the docs-only decision and,
  # for `package`, on the RT-585 needs_package decision: a package job that
  # was needed but skipped/failed/cancelled FAILS `ci`.
  ci:
    needs: [changes, static, test-shard, test, package, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        shell: bash
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          NEEDS_PACKAGE: ${{ needs.changes.outputs.needs_package }}
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          TEST_SHARD: ${{ needs.test-shard.result }}
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "changes=$CHANGES docs_only=$DOCS_ONLY needs_package=$NEEDS_PACKAGE static=$STATIC test-shard=$TEST_SHARD test=$TEST package=$PACKAGE docs=$DOCS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes job did not succeed ($CHANGES)"; exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            required="DOCS"
          else
            required="STATIC TEST_SHARD TEST"
          fi
          # Anything other than an explicit 'false' means package is needed,
          # also for docs-only PRs whose paths are not package-irrelevant.
          if [ "$NEEDS_PACKAGE" != "false" ]; then
            required="$required PACKAGE"
          elif [ "$PACKAGE" = "failure" ] || [ "$PACKAGE" = "cancelled" ]; then
            echo "::error::package job result is '$PACKAGE'"; exit 1
          fi
          failed=0
          for job in $required; do
            result="${!job}"
            if [ "$result" != "success" ]; then
              echo "::error::$job job result is '$result' (expected success)"
              failed=1
            fi
          done
          exit $failed
