# RT-803 (RT-322 S-E) — manual LAB update drill, P0 spike only.
#
# LAB ONLY. Builds one per-user NSIS installer signed with an EPHEMERAL self-signed test
# certificate (subject marker `LAB TEST - NOT FOR PRODUCTION`, created on the runner, never
# exported, removed again), trusts only its PUBLIC root on the ephemeral runner, verifies the
# Authenticode signature, installs silently and launches the packaged app. It proves the runner
# can host the RT-322 S-D drill; it does NOT run any of the eight S-D cases and is NOT evidence
# for RT-324 (production-signed, real-terminal). The production signing path is RT-321 and is
# unchanged.
#
# Not part of the PR gate: manual `workflow_dispatch` only, no `push`/`pull_request` trigger, not
# listed in the `ci` aggregate. No secrets, read-only token, nothing is published or released;
# the evidence bundle (logs, manifest, public root certificate, one screenshot) is kept 14 days
# and never contains the installer.
name: lab-update-drill

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag or SHA) to build. Default: main'
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: lab-update-drill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  p0-spike:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Same two install steps as the `package` job in ci.yml: the lab installer packages the same app.
      - name: Install dependencies
        run: npm ci

      - name: Rebuild argon2 for Electron ABI (packaging)
        run: npx electron-rebuild -f -w argon2

      - name: Lab spike (certs, build, trust, verify, install, launch)
        shell: pwsh
        run: ./scripts/lab/ci/run-lab-spike.ps1 -Evidence "$env:RUNNER_TEMP/evidence"

      - name: Remove the ephemeral lab trust
        if: always()
        shell: pwsh
        run: ./scripts/lab/ci/run-lab-spike.ps1 -Cleanup

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-update-drill-p0-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: warn
