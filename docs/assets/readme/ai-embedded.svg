<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" aria-label="Two designs compared. AI-integrated: the AI sits outside the system boundary and reaches it through a side channel. AI-embedded: the AI runs through every layer inside the boundary, under the same rules." role="img" viewBox="0 0 1280 460"><title>Two designs compared. AI-integrated: the AI sits outside the system boundary and reaches it through a side channel. AI-embedded: the AI runs through every layer inside the boundary, under the same rules.</title><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#070b1f"/><stop offset=".55" stop-color="#0c1230"/><stop offset="1" stop-color="#060918"/></linearGradient><linearGradient id="aurora" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><linearGradient id="auroraV" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1" d="M32 0H0V32"/></pattern><filter id="glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="b" stdDeviation="6"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur stdDeviation="14"/></filter><marker id="arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#cbd5e1" d="M1 1L9 5L1 9z"/></marker><linearGradient id="g-pos" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient><linearGradient id="g-console" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0e7490"/></linearGradient><linearGradient id="g-core" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b21b6"/></linearGradient><linearGradient id="g-connector" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/></linearGradient></defs><style>@keyframes pulse{0%{opacity:.35}50%{opacity:1}}@keyframes beacon{0%{opacity:.25;r:5}50%{opacity:1;r:8}}text{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,&apos;Helvetica Neue&apos;,Arial,sans-serif}.flow{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}.spark{stroke-dasharray:46 460;animation:spark 3.2s linear infinite}.pulse{animation:pulse 2.6s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1280" height="460" fill="url(#bg)" rx="20"/><rect width="1280" height="460" fill="url(#grid)" rx="20"/><circle cx="940" cy="230" r="230" fill="#7c3aed" filter="url(#soft)" opacity=".22"/><circle cx="300" cy="230" r="160" fill="#475569" filter="url(#soft)" opacity=".12"/><rect width="1279" height="459" x=".5" y=".5" fill="none" stroke="#334155" stroke-opacity=".7" rx="20"/><line x1="640" x2="640" y1="40" y2="420" stroke="#334155" stroke-dasharray="4 6"/><text x="40" y="52" fill="#94a3b8" font-size="13" font-weight="800" letter-spacing="3">AI-INTEGRATED</text><text x="40" y="74" fill="#64748b" font-size="15">what Retail Tower OS is not</text><text x="680" y="52" fill="url(#aurora)" font-size="13" font-weight="800" letter-spacing="3">AI-EMBEDDED</text><text x="680" y="74" fill="#e2e8f0" font-size="15">what Retail Tower OS is</text><rect width="380" height="262" x="48" y="100" fill="none" stroke="#64748b" stroke-dasharray="7 6" stroke-width="2" rx="18"/><text x="238" y="384" fill="#94a3b8" font-size="12" letter-spacing="1.5" text-anchor="middle">TENANT ISOLATION · DEFAULT-DENY · AUDIT</text><rect width="344" height="64" x="66" y="118" fill