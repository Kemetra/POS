<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" aria-labelledby="arch-title arch-desc" role="img" viewBox="0 0 1280 760"><title id="arch-title">POS-Pulse system architecture</title><desc id="arch-desc">Animated architecture diagram showing POS-Pulse as the focal node at centre, with a READ-DOWN data flow bringing catalogue snapshots from Data-Pulse-2 into the local SQLite read model, and a CAPTURE-UP sale outbox flow rising back to Data-Pulse-2. Cashier UI and barcode scanner feed the local catalogue search; finalised sales flow through the sale outbox toward the backend. Data-Pulse-2 sits above, connecting onward to the ERPNext Connector and ERPNext.</desc><defs><linearGradient id="bg-grad" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#0a0f24"/><stop offset="55%" stop-color="#0d1330"/><stop offset="100%" stop-color="#070a1c"/></linearGradient><linearGradient id="grad-pos" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#2d55c8"/><stop offset="100%" stop-color="#0b1c52"/></linearGradient><linearGradient id="grad-dp2" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#9d5cf0"/><stop offset="100%" stop-color="#3b1283"/></linearGradient><linearGradient id="grad-connector" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d47a2a"/><stop offset="100%" stop-color="#5c2705"/></linearGradient><linearGradient id="grad-erpnext" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#18998a"/><stop offset="100%" stop-color="#052e2b"/></linearGradient><linearGradient id="grad-cashier" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#374999"/><stop offset="100%" stop-color="#1a2461"/></linearGradient><linearGradient id="grad-scanner" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#1e5090"/><stop offset="100%" stop-color="#0a2040"/></linearGradient><linearGradient id="grad-sqlite" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#1a4090"/><stop offset="100%" stop-color="#07163a"/></linearGradient><linearGradient id="grad-outbox" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#d47a2a"/><stop offset="100%" stop-color="#5c2705"/></linearGradient><linearGradient id="hi" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity=".1"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="pkt-cyan" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient><linearGradient id="pkt-amber" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f97316"/></linearGradient><filter id="card-shadow" width="140%" height="160%" x="-20%" y="-20%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".55" stdDeviation="10"/></filter><filter id="pkt-glow" width="500%" height="500%" x="-200%" y="-200%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="pulse-glow" width="220%" height="220%" x="-60%" y="-60%"><feGaussianBlur result="blur" stdDeviation="18"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="edge-glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="rd-path-1" fill="none" d="M640 168 C640 220 640 260 640 310"/><path id="rd-path-2" fill="none" d="M640 168 C630 240 580 280 500 320 C450 350 430 390 430 430"/><path id="rd-path-3" fill="none" d="M640 168 C650 240 700 280 760 320 C810 350 810 390 810 430"/><path id="cu-path-1" fill="none" d="M810 430 C810 380 810 320 760 270 C710 220 680 190 640 168"/><path id="cu-path-2" fill="none" d="M500 430 C500 380 560 300 620 250 C635 238 638 205 640 168"/><path id="dp2-conn-path" fill="none" d="M870 140 C960 140 1030 140 1090 200 C1110 218 1110 240 1110 260"/><path id="conn-erp-path" fill="none" d="M1110 360 C1110 390 1110 420 1110 450"/><path id="cashier-pos" fill="none" d="M200 400 C260 390 300 370 360 370"/><path id="scanner-pos" fill="none" d="M200 500 C260 490 300 450 360 420"/><style>.lbl{font:700 14px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#e2e8f0}.lbl-sm{font:600 11px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#94a3b8}.lbl-xs{font:600 10px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#64748b}.node-title{font:700 15px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#f8fafc}.node-sub,.node-sub-amber{font:600 11px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#93c5fd}.node-sub-amber{fill:#fcd34d}.badge{font:700 11px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#f8fafc}.legend-title{font:700 12px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#94a3b8;letter-spacing:1px}.legend-lbl{font:600 11px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#cbd5e1}.flow-label,.flow-label-amber{font:600 12px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#67e8f9}.flow-label-amber{fill:#fbbf24}.title-main{font:800 28px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#f8fafc}.title-sub{font:500 14px &apos;Segoe UI&apos;,Arial,sans-serif;fill:#64748b;letter-spacing:1px}@media (prefers-reduced-motion:reduce){animate,animateMotion{animation:none!important}}</style></defs><rect width="1280" height="760" fill="url(#bg-grad)"/><g stroke="#1e2d55" stroke-width="1" opacity=".35"><line x1="0" x2="1280" y1="100" y2="100"/><line x1="0" x2="1280" y1="200" y2="200"/><line x1="0" x2="1280" y1="300" y2="300"/><line x1="0" x2="1280" y1="400" y2="400"/><line x1="0" x2="1280" y1="500" y2="500"/><line x1="0" x2="1280" y1="600" y2="600"/><line x1="0" x2="1280" y1="700" y2="700"/><line x1="160" x2="160" y1="0" y2="760"/><line x1="320" x2="320" y1="0" y2="760"/><line x1="480" x2="480" y1="0" y2="760"/><line x1="640" x2="640" y1="0" y2="760"/><line x1="800" x2="800" y1="0" y2="760"/><line x1="960" x2="960" y1="0" y2="760"/><line x1="1120" x2="1120" y1="0" y2="760"/></g><text x="640"