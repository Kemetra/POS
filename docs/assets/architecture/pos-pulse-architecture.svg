de-title">Data-Pulse-2</text><text x="526" y="135" class="node-sub">SaaS Backend · Catalogue source</text><text x="526" y="152" class="node-sub">Resolved Sellable Catalogue (snapshot + delta)</text><circle cx="640" cy="370" r="90" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0"><animate attributeName="r" dur="3.2s" repeatCount="indefinite" values="90;140;90"/><animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0.6;0;0.6"/></circle><circle cx="640" cy="370" r="70" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0"><animate attributeName="r" begin="1.6s" dur="3.2s" repeatCount="indefinite" values="70;130;70"/><animate attributeName="opacity" begin="1.6s" dur="3.2s" repeatCount="indefinite" values="0.5;0;0.5"/></circle><g filter="url(#card-shadow)"><rect width="282" height="110" x="369" y="319" fill="#040e2a" opacity=".8" rx="16"/><rect width="282" height="110" x="360" y="310" fill="url(#grad-pos)" rx="16"/><rect width="282" height="24" x="360" y="310" fill="url(#hi)" rx="16"/><rect width="282" height="110" x="360" y="310" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity=".6" rx="16"/></g><g transform="translate(384, 333)"><rect width="36" height="26" x="0" y="0" fill="none" stroke="#93c5fd" stroke-width="2" rx="3"/><line x1="12" x2="12" y1="26" y2="36" stroke="#93c5fd" stroke-width="2"/><line x1="24" x2="24" y1="26" y2="36" stroke="#93c5fd" stroke-width="2"/><line x1="6" x2="30" y1="36" y2="36" stroke="#93c5fd" stroke-width="2"/><rect width="30" height="18" x="3" y="3" fill="#1d3a8a" opacity=".7" rx="1"/></g><text x="436" y="352" class="node-title">POS-Pulse</text><text x="436" y="370" class="node-sub">Electron 40 · React 19 · Vite 8 · TypeScript strict</text><text x="436" y="388" class="node-sub">Tailwind 4 · better-sqlite3 · Windows x64</text><text x="436" y="404" class="node-sub">Typed preload bridge · safeStorage · offline-first</text><g filter="url(#card-shadow)"><rect width="242" height="84" x="369" y="449" fill